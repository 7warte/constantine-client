<div class="auth-page">
  <div class="auth-layout">
    <div class="auth-layout__image" style="background-image: url('assets/homepage/hero-images/olivia-pedler-YX0HXl2SwIo-unsplash.jpg')">
      <div class="auth-layout__image-overlay">
        <h2>Share your knowledge.<br>Earn from your stories.</h2>
      </div>
    </div>

    <div class="auth-card">
      <div class="auth-card__brand">
        <h1>Join Constantine</h1>
        <p>Create, discover, and share tours worldwide</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
        @if (error()) {
          <div class="auth-form__error" role="alert">{{ error() }}</div>
        }

        <app-input
          label="Display name"
          formControlName="display_name"
          [invalid]="form.controls.display_name.invalid && form.controls.display_name.touched"
          errorMessage="Display name is required"
        />

        <app-input
          label="Username"
          formControlName="username"
          hint="3-30 characters: letters, numbers, _ and - (capitals allowed)"
          [invalid]="form.controls.username.invalid && form.controls.username.touched"
          errorMessage="Choose a valid username (letters, numbers, _, -)"
        />

        <app-input
          label="Email"
          type="email"
          formControlName="email"
          [invalid]="form.controls.email.invalid && form.controls.email.touched"
          errorMessage="Enter a valid email address"
        />

        <app-input
          label="Phone (optional)"
          type="tel"
          formControlName="phone"
          hint="Only used if we need to reach you about a purchase"
          [invalid]="form.controls.phone.invalid && form.controls.phone.touched"
          errorMessage="Phone number is too long"
        />

        <app-input
          label="Password"
          type="password"
          formControlName="password"
          hint="Minimum 8 characters"
          [invalid]="form.controls.password.invalid && form.controls.password.touched"
          errorMessage="Password must be at least 8 characters"
        />

        <app-input
          label="Confirm password"
          type="password"
          formControlName="confirm_password"
          [invalid]="(form.controls.confirm_password.invalid || form.errors?.['passwordMismatch']) && form.controls.confirm_password.touched"
          [errorMessage]="form.controls.confirm_password.invalid ? 'Please repeat your password' : 'Passwords do not match'"
        />

        <app-button type="submit" variant="primary" size="lg" [loading]="loading()" [block]="true">
          Create account
        </app-button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <app-google-signin (credential)="onGoogle($event)" />

      @if (googleError()) {
        <div class="auth-form__error auth-form__error--google" role="alert">{{ googleError() }}</div>
      }

      <p class="auth-card__switch">
        Already have an account?
        <a routerLink="/auth/login">Sign in</a>
      </p>
    </div>
  </div>
</div>

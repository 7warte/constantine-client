<footer class="footer">
  <div class="footer__inner container">
    <div class="footer__cols">

      <!-- Column 1 — Brand -->
      <div class="footer__col footer__col--brand">
        <div class="footer__brand">
          <span class="footer__mark" aria-hidden="true"></span>
          <span class="footer__name">Constantine</span>
        </div>
        <p class="footer__tagline">Audio-guided tours, told by people who live there.</p>
        <address class="footer__address">
          <a href="mailto:hello@constantine.tours">hello&#64;constantine.tours</a>
        </address>
      </div>

      <!-- Column 2 — Explore -->
      <div class="footer__col">
        <h4 class="footer__col-title">Explore</h4>
        <ul class="footer__links">
          <li><a routerLink="/explore">All tours</a></li>
          <li><a routerLink="/about">About</a></li>
          <li><a routerLink="/faq">FAQ</a></li>
          <li><a routerLink="/auth/register">Become a creator</a></li>
        </ul>
      </div>

      <!-- Column 3 — Legal -->
      <div class="footer__col">
        <h4 class="footer__col-title">Legal</h4>
        <ul class="footer__links">
          <li><a routerLink="/terms">Terms of service</a></li>
          <li><a routerLink="/privacy">Privacy policy</a></li>
          <li><a routerLink="/refunds">Refund policy</a></li>
          <li><a routerLink="/contact">Contact</a></li>
        </ul>
      </div>
    </div>

    <p class="footer__copy">&copy; {{ year }} Constantine. All rights reserved. <span class="footer__version">v{{ version }}</span></p>
  </div>
</footer>

<div class="field" [class.field--invalid]="invalid" [class.field--disabled]="disabled">
  @if (label) {
    <label class="field__label">{{ label }}</label>
  }
  @if (multiline) {
    <textarea
      class="field__input field__input--multiline"
      [rows]="rows"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onTouched()"
    ></textarea>
  } @else {
    <div class="field__control">
      <input
        class="field__input"
        [class.field__input--with-toggle]="isPassword"
        [type]="effectiveType"
        [placeholder]="placeholder"
        [value]="value"
        [disabled]="disabled"
        (input)="onInput($event)"
        (blur)="onTouched()"
      />
      @if (isPassword) {
        <button
          type="button"
          class="field__toggle"
          (click)="toggleReveal()"
          [attr.aria-label]="revealed ? 'Hide password' : 'Show password'"
        >{{ revealed ? 'Hide' : 'Show' }}</button>
      }
    </div>
  }
  <span class="field__message">
    @if (invalid && errorMessage) {
      <span class="field__error" role="alert">{{ errorMessage }}</span>
    } @else if (hint) {
      <span class="field__hint">{{ hint }}</span>
    }
  </span>
</div>
